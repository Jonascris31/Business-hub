spring.application.name=business-hub

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/business_hub}
spring.datasource.username=${DB_USERNAME:business_hub}
spring.datasource.password=${DB_PASSWORD:business_hub_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true